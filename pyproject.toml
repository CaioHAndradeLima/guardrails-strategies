[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrails-strategies"
version = "0.1.0"
description = "Reference implementation and evaluation gates for layered guard-rails in RAG and multi-agent systems"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = []
live-cloud = []

[project.scripts]
guardrails-lab = "guardrails_strategies.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
